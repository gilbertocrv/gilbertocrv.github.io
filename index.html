      if(known){ if(g.pushed_at) known.pushed=g.pushed_at.slice(0,10); return; }
      novos++;
      const rep={id:g.name,cat:"novos",title:g.name,desc:g.description||"Sem descrição no GitHub.",tags:g.topics||[],lang:g.language||"—",created:g.created_at.slice(0,10),pushed:(g.pushed_at||g.created_at).slice(0,10),repo:g.html_url,pages:g.has_pages?"https://gilbertocrv.github.io/"+g.name+"/":null};
      DATA.repos.push(rep); byId[g.name]=rep;
    });
    $("#sync").textContent="Sincronizado com o GitHub agora"+(novos?` · ${novos} repositório(s) novo(s) em “Novos”.`:".");
    $("#catChips").querySelectorAll(".chip").forEach(c=>c.remove()); $("#tagChips").querySelectorAll(".chip").forEach(c=>c.remove());
    chips(); syncChips(); render();
  }catch(e){}
}
chips();syncChips();render();sync();
</script>
